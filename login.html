<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private Portal Login | Tricky Real Estate</title>
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">

  <!-- Google Fonts: Cormorant Garamond & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      background-color: var(--color-charcoal-dark);
      color: var(--color-white);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      margin: 0;
    }
    .login-box {
      background: #181818;
      border: 1px solid rgba(184, 151, 90, 0.3);
      padding: 48px;
      border-radius: 4px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }
    .security-notice {
      margin-top: 24px;
      padding: 12px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 11px;
      color: rgba(255, 255, 255, 0.5);
      line-height: 1.5;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- Brand Logo -->
  <a href="index.html" class="brand-logo logo-white" style="margin-bottom: 36px;">
    <span class="logo-tricky" style="font-size: 32px;">Tricky</span>
    <span class="logo-divider" style="width: 55px;"></span>
    <span class="logo-sub" style="font-size: 10px;">REAL ESTATE</span>
  </a>

  <!-- Login Form Box -->
  <div class="login-box">
    <div class="text-center" style="margin-bottom: 28px;">
      <span class="section-label">CONFIDENTIAL PORTAL</span>
      <h2 style="font-family: var(--font-serif); font-size: 32px; font-weight: 300;">Staff &amp; Admin Sign In</h2>
      <div class="thin-gold-line center"></div>
      <p style="font-size: 13px; color: rgba(255, 255, 255, 0.6);">
        Access private buyer dossiers, deal pipeline, and database records.
      </p>
    </div>

    <form id="adminLoginForm">
      <div class="form-group" style="margin-bottom: 20px;">
        <label for="loginEmail" style="color: rgba(255,255,255,0.7);">Staff Email *</label>
        <input type="email" id="loginEmail" required placeholder="name@trickyrealestate.ae" 
               autocomplete="username"
               style="background: #242424; color: #fff; border-color: rgba(255,255,255,0.2);">
      </div>

      <div class="form-group" style="margin-bottom: 24px;">
        <label for="loginPassword" style="color: rgba(255,255,255,0.7);">Password *</label>
        <input type="password" id="loginPassword" required placeholder="••••••••••••" 
               autocomplete="current-password"
               style="background: #242424; color: #fff; border-color: rgba(255,255,255,0.2);">
      </div>

      <div id="loginError" style="color: #ff6b6b; font-size: 12px; margin-bottom: 16px; display: none;" role="alert"></div>

      <button type="submit" class="btn btn-gold-solid" style="width: 100%;" id="loginSubmitBtn">
        Authenticate Session
      </button>

      <div class="security-notice">
        🔒 Authorized personnel only. All access attempts are cryptographically verified, monitored, and logged.
      </div>
    </form>
  </div>

  <div style="margin-top: 30px; font-size: 12px; color: rgba(255,255,255,0.4);">
    <a href="index.html" style="color: rgba(255,255,255,0.6);">&larr; Return to Public Website</a>
  </div>

  <script>
    document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value.trim();
      const btn = document.getElementById('loginSubmitBtn');
      const errBox = document.getElementById('loginError');

      btn.disabled = true;
      btn.textContent = 'AUTHENTICATING...';
      errBox.style.display = 'none';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        btn.disabled = false;
        btn.textContent = 'AUTHENTICATE SESSION';

        if (!data.success || !data.user || !data.token) {
          errBox.textContent = data.error || 'Authentication failed. Please verify credentials.';
          errBox.style.display = 'block';
          return;
        }

        // Store secure session data in localStorage
        localStorage.setItem('trickyStaffSession', JSON.stringify(data.user));
        localStorage.setItem('trickyStaffToken', data.token);

        // Redirect to admin portal
        window.location.href = 'admin.html';
      } catch (err) {
        btn.disabled = false;
        btn.textContent = 'AUTHENTICATE SESSION';
        errBox.textContent = 'Connection error. Please try again.';
        errBox.style.display = 'block';
      }
    });
  </script>
</body>
</html>
